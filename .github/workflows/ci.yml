name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  e2e:
    name: Unit + E2E on Medusa ${{ matrix.medusa }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 2.19.0 = the locked versions (and the peerDependencies floor); newer releases are switched in.
        medusa: ["2.19.0", "2.22.0"]
    # Same ports as the spike containers the runner insists on; no real doit.id key is used.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: spike
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:spike@127.0.0.1:55432/doit_e2e
      REDIS_URL: redis://127.0.0.1:56379
      E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integration-tests/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: integration-tests/app
      # The published package is built with the locked toolchain; it is then run on each release.
      - run: npm run build
      - name: Switch to Medusa ${{ matrix.medusa }}
        if: matrix.medusa != '2.19.0'
        run: node scripts/use-medusa-version.mjs --write ${{ matrix.medusa }} . integration-tests/app
      - name: Installed Medusa
        run: |
          node -p "'root ' + require('./node_modules/@medusajs/medusa/package.json').version"
          node -p "'host app ' + require('./integration-tests/app/node_modules/@medusajs/medusa/package.json').version"
      - run: npm run test:unit
      - run: node integration-tests/run.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-medusa-${{ matrix.medusa }}
          path: e2e-logs
          retention-days: 7
